<style>
#ID-bg { background: #F5F2EF; }
#ID-cal { position: absolute; left: 300px; top: 90px; width: 480px; height: 500px; background: #FFFFFF; border: 10px solid #1C1410; box-shadow: 14px 14px 0 #1C1410; }
#ID-calhead { position: absolute; left: 0; right: 0; top: 0; height: 130px; background: #D8000F; border-bottom: 10px solid #1C1410; color: #FFFFFF; font-size: 96px; display: flex; align-items: center; justify-content: center; }
#ID-day { position: absolute; left: 0; right: 0; top: 130px; text-align: center; font-size: 270px; color: #1C1410; }
#ID-year { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 56px; color: #D8000F; }
#ID-rings { position: absolute; left: 60px; right: 60px; top: -30px; height: 60px; background: radial-gradient(circle, #1C1410 0 12px, transparent 13px) 0 0 / 90px 60px repeat-x; }
.ID-off { position: absolute; top: 640px; width: 300px; height: 675px; }
#ID-table { position: absolute; left: -20px; right: -20px; top: 1000px; height: 140px; background: #5C2D14; border-top: 10px solid #1C1410; border-bottom: 10px solid #1C1410; }
#ID-plaque { position: absolute; left: 330px; top: 1022px; width: 420px; padding: 8px 0; background: #FFD23F; border: 6px solid #1C1410; text-align: center; font-size: 36px; }
.ID-card { position: absolute; top: 1190px; width: 170px; height: 230px; background: #FFFFFF; border: 7px solid #1C1410; box-shadow: 8px 8px 0 #1C1410; display: flex; align-items: center; justify-content: center; font-size: 104px; color: #1C1410; }
.ID-x { position: absolute; inset: -10px; overflow: visible; }
#ID-glow { position: absolute; left: 330px; top: 1150px; width: 420px; height: 420px; }
#ID-stamp { position: absolute; left: 280px; top: 1290px; width: 520px; padding: 6px 0; border: 12px solid #D8000F; color: #D8000F; text-align: center; font-size: 96px; background: rgba(255, 255, 255, 0.86); }
#ID-five { position: absolute; left: 0; right: 0; top: 1460px; text-align: center; font-size: 46px; color: #1C1410; }
</style>
<markup>
<div id="ID-bg" class="cmc-bg clip" data-start="0" data-duration="{DUR}" data-track-index="0"><div class="cmc-halftone"></div></div>
<div id="ID-world" class="cmc-world">
  <div id="ID-cal"><div id="ID-rings"></div><div id="ID-calhead" class="cmc-shrik">July</div><div id="ID-day" class="cmc-shrik">15</div><div id="ID-year" class="cmc-label">2010</div></div>
  <div id="ID-offs"></div>
  <div id="ID-glowwrap"></div>
  <div id="ID-table"></div>
  <div id="ID-plaque" class="cmc-label">Union Cabinet</div>
  <div id="ID-cards"></div>
  <div id="ID-stamp" class="cmc-shrik" data-layout-allow-overlap>APPROVED</div>
  <div id="ID-five" class="cmc-label">picked from the final 5</div>
</div>
</markup>
<script>
document.getElementById("ID-glowwrap").outerHTML = burst("ID-glow", "#FFD23F", 30, 0.2);
// three officials behind the cabinet table
const offs = document.getElementById("ID-offs");
[60, 390, 720].forEach((x, i) => {
  offs.insertAdjacentHTML("beforeend", `<div class="ID-off" id="ID-off${i}" style="left:${x}px">${person("ID-o" + i, "official", { seated: true })}</div>`);
});
// five shortlisted designs; the winner sits in the middle
const glyphs = ["Rs", "R=", "₹", "र", "R"];
const cards = document.getElementById("ID-cards");
glyphs.forEach((g, i) => {
  const c = document.createElement("div");
  c.className = "ID-card cmc-shrik";
  c.id = "ID-card" + i;
  c.style.left = 50 + i * 200 + "px";
  c.innerHTML = (i === 3 ? `<span style="font-family:'Noto Sans Devanagari'">${g}</span>` : g) +
    (i === 2 ? "" : `<svg class="ID-x" id="ID-x${i}" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M12 12 L88 88 M88 12 L12 88" stroke="#D8000F" stroke-width="12" stroke-linecap="round"/></svg>`);
  cards.appendChild(c);
});
tl.fromTo("#ID-world", { scale: 1.05 }, { scale: 1, duration: DUR, ease: "none" }, 0);
// the date: "fifteenth" → "July" → "twenty ten"
tl.fromTo("#ID-cal", { y: -700, rotation: 8 }, { y: 0, rotation: -4, duration: 0.45, ease: "back.out(1.4)" }, 0.1);
tl.fromTo("#ID-day", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 0.45);
tl.fromTo("#ID-calhead", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.25, ease: "back.out(2)" }, 1.08);
tl.fromTo("#ID-year", { scale: 2.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.in" }, 1.6);
shake(tl, "#ID-cal", 1.85, 10);
// the cabinet appears
[0, 1, 2].forEach((i) => {
  tl.fromTo(`#ID-off${i}`, { y: 420, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 2.6 + i * 0.12);
  blink(tl, "ID-o" + i, [3.2 + i * 0.3, 5.0 - i * 0.2]);
});
tl.fromTo("#ID-table", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 2.55);
tl.fromTo("#ID-plaque", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 2.85);
// the five cards deal in
glyphs.forEach((g, i) => tl.fromTo(`#ID-card${i}`, { y: 500, opacity: 0, rotation: (i - 2) * 14 }, { y: 0, opacity: 1, rotation: (i - 2) * 4, duration: 0.35, ease: "back.out(1.6)" }, 2.95 + i * 0.06));
// "picked": four get crossed out, officials lean in
[0, 1, 3, 4].forEach((i, k) => {
  tl.fromTo(`#ID-x${i}`, { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.12, ease: "power4.in" }, 3.55 + k * 0.1);
  tl.to(`#ID-card${i}`, { opacity: 0.45, scale: 0.9, duration: 0.2 }, 3.65 + k * 0.1);
});
[0, 1, 2].forEach((i) => pose(tl, "ID-o" + i, 3.6, { head: (i - 1) * -10 }, 0.3));
// "his design": the ₹ card rises, burst behind, APPROVED stamp slams
tl.fromTo("#ID-glow", { scale: 0, rotation: 0 }, { scale: 1, rotation: 40, duration: 1.4, ease: "power2.out" }, 4.0);
tl.to("#ID-card2", { y: -40, scale: 1.35, rotation: -3, duration: 0.35, ease: "back.out(1.8)" }, 4.06);
tl.fromTo("#ID-stamp", { scale: 3, rotation: -28, opacity: 0 }, { scale: 1, rotation: -10, opacity: 1, duration: 0.2, ease: "power4.in" }, 4.3);
shake(tl, "#ID-world", 4.5, 16);
[0, 1, 2].forEach((i) => mouth(tl, "ID-o" + i, 4.55, "mOpen"));
tl.fromTo("#ID-five", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, 4.9);
</script>
