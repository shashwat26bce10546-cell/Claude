<style>
#ID-bg { background: #D8000F; }
#ID-burst { position: absolute; left: -260px; top: -180px; width: 1600px; height: 1600px; }
#ID-phone { position: absolute; left: 310px; top: 820px; width: 460px; height: 800px; background: #1C1410; border-radius: 56px; border: 9px solid #1C1410; box-shadow: 16px 16px 0 rgba(28, 20, 16, 0.55); }
#ID-screen { position: absolute; left: 22px; top: 60px; right: 22px; bottom: 60px; background: #F5F2EF; border-radius: 22px; overflow: hidden; }
#ID-amt { position: absolute; left: 0; right: 0; top: 120px; text-align: center; font-size: 150px; color: #1C1410; }
#ID-to { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-size: 30px; color: #8a8178; }
#ID-pay { position: absolute; left: 50px; right: 50px; top: 360px; height: 120px; background: #138808; border: 6px solid #1C1410; border-radius: 20px; color: #fff; font-size: 64px; display: flex; align-items: center; justify-content: center; }
#ID-flash { position: absolute; inset: 0; background: #FFFFFF; opacity: 0; }
#ID-hand { position: absolute; left: 520px; top: 1040px; width: 420px; height: 560px; overflow: visible; }
#ID-big { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-size: 540px; color: #FFFFFF; }
#ID-tap { position: absolute; left: 700px; top: 1060px; width: 300px; height: 300px; }
#ID-tapword { position: absolute; left: 700px; top: 1150px; width: 300px; text-align: center; font-size: 76px; color: #D8000F; }
#ID-q1 { width: 300px; height: 260px; left: 730px; top: 170px; font-size: 220px; padding-top: 30px; }
#ID-q2 { width: 200px; height: 180px; left: 60px; top: 260px; font-size: 140px; padding-top: 20px; }
</style>
<markup>
<div id="ID-bg" class="cmc-bg clip" data-start="0" data-duration="{DUR}" data-track-index="0"><div class="cmc-halftone-light"></div></div>
<div id="ID-world" class="cmc-world">
  <div id="ID-burstwrap"></div>
  <div id="ID-phone">
    <div id="ID-screen">
      <div id="ID-to" class="cmc-label">PAY TO CHAI WALA</div>
      <div id="ID-amt" class="cmc-shrik">₹50</div>
      <div id="ID-pay" class="cmc-shrik">PAY</div>
      <div id="ID-flash"></div>
    </div>
  </div>
  <svg id="ID-hand" viewBox="0 0 420 560">
    <path d="M160 560 C150 440 150 330 200 260 C220 230 250 230 262 252 L280 300 C300 270 340 280 338 320 L330 420 C330 470 320 520 300 560 Z" fill="#B9774E" stroke="#1C1410" stroke-width="9" stroke-linejoin="round"/>
    <path d="M300 560 C320 520 330 470 330 420 L322 380 C318 470 300 520 280 560 Z" fill="#8C5232"/>
    <g id="ID-thumb"><path d="M200 262 C170 220 120 170 92 150 C70 136 52 162 70 182 C100 214 150 262 176 300 Z" fill="#B9774E" stroke="#1C1410" stroke-width="9" stroke-linejoin="round"/></g>
    <path d="M150 560 C146 470 150 400 164 360" fill="none" stroke="#2F6F99" stroke-width="40"/>
  </svg>
  <div id="ID-tapwrap"></div>
  <div id="ID-tapword" class="cmc-shrik cmc-ink-outline">TAP!</div>
  <div id="ID-big" class="cmc-shrik cmc-ink-outline cmc-stack-shadow" data-layout-allow-overlap>₹</div>
  <div id="ID-q1" class="cmc-bubble">?</div>
  <div id="ID-q2" class="cmc-bubble">?</div>
</div>
</markup>
<script>
document.getElementById("ID-burstwrap").outerHTML = burst("ID-burst", "#A8000B", 40, 0.18);
document.getElementById("ID-tapwrap").outerHTML = star("ID-tap", YELLOW, 12, 300, 470);
// slow camera push + rotating burst
tl.fromTo("#ID-world", { scale: 1 }, { scale: 1.06, duration: DUR, ease: "none" }, 0);
tl.fromTo("#ID-burst", { rotation: 0 }, { rotation: 22, duration: DUR, ease: "none" }, 0);
// phone + hand slide up (hero visible immediately)
tl.fromTo("#ID-phone", { y: 500, rotation: 8 }, { y: 0, rotation: -3, duration: 0.45, ease: "back.out(1.4)" }, 0);
tl.fromTo("#ID-hand", { y: 600 }, { y: 0, duration: 0.5, ease: "back.out(1.3)" }, 0.05);
// thumb taps PAY on "symbol"
tl.fromTo("#ID-thumb", { rotation: 0, svgOrigin: "190 280" }, { rotation: 16, svgOrigin: "190 280", duration: 0.12, ease: "power2.in" }, 0.62);
tl.to("#ID-thumb", { rotation: 0, svgOrigin: "190 280", duration: 0.15, ease: "power2.out" }, 0.76);
tl.fromTo("#ID-pay", { scale: 1 }, { scale: 0.9, duration: 0.08, yoyo: true, repeat: 1, ease: "none" }, 0.72);
tl.fromTo("#ID-flash", { opacity: 0 }, { opacity: 1, duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, 0.76);
popIn(tl, "#ID-tap", 0.74, { rotation: 20 }, 0.25);
popIn(tl, "#ID-tapword", 0.78, { rotation: -20 }, 0.25);
tl.to(["#ID-tap", "#ID-tapword"], { scale: 0, duration: 0.2, ease: "power2.in" }, 1.6);
// the giant ₹ bursts out of the screen
tl.fromTo("#ID-big", { y: 760, scale: 0.15, rotation: -30, opacity: 0 }, { y: 0, scale: 1, rotation: -6, opacity: 1, duration: 0.6, ease: "back.out(1.5)" }, 0.85);
shake(tl, "#ID-world", 1.4, 16);
tl.fromTo("#ID-big", { y: 0 }, { y: -18, duration: 0.6, yoyo: true, repeat: 2, ease: "sine.inOut", immediateRender: false }, 1.6);
// the question: who designed it?
popIn(tl, "#ID-q1", 3.0, { rotation: 18 });
popIn(tl, "#ID-q2", 3.25, { rotation: -18 });
shake(tl, "#ID-q1", 3.62, 12);
tl.to("#ID-big", { rotation: 4, duration: 0.25, ease: "back.out(3)" }, 3.6);
</script>
