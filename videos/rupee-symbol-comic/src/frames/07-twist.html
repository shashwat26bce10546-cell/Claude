<style>
#ID-bg { background: #FBEFD9; }
#ID-sun { position: absolute; left: 700px; top: 180px; width: 300px; height: 300px; border-radius: 50%; background: #D8000F; border: 10px solid #1C1410; overflow: hidden; }
#ID-scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1600px; overflow: visible; }
#ID-guy { position: absolute; left: 360px; top: 560px; width: 360px; height: 810px; transform-origin: 50% 100%; }
#ID-twist { position: absolute; left: 140px; top: 200px; width: 800px; height: 520px; }
#ID-twistword { position: absolute; left: 140px; top: 360px; width: 800px; text-align: center; font-size: 170px; color: #D8000F; }
#ID-id { position: absolute; left: 640px; top: 960px; width: 360px; height: 230px; background: #FFFFFF; border: 8px solid #1C1410; box-shadow: 10px 10px 0 #1C1410; }
#ID-id b { position: absolute; left: 0; right: 0; top: 0; height: 56px; background: #2F6F99; border-bottom: 6px solid #1C1410; color: #FFFFFF; font-size: 28px; display: flex; align-items: center; justify-content: center; }
#ID-idph { position: absolute; left: 22px; top: 76px; width: 100px; height: 126px; background: #E8DCC8; border: 5px solid #1C1410; }
#ID-idtx { position: absolute; left: 140px; top: 86px; right: 14px; font-size: 30px; line-height: 1.2; }
#ID-what { width: 430px; height: 290px; left: 600px; top: 540px; font-size: 88px; padding-top: 20px; }
#ID-whatlines { position: absolute; left: 360px; top: 560px; width: 380px; height: 380px; }
</style>
<markup>
<div id="ID-bg" class="cmc-bg clip" data-start="0" data-duration="{DUR}" data-track-index="0"><div class="cmc-halftone" style="opacity: 0.5"></div></div>
<div id="ID-world" class="cmc-world">
  <div id="ID-sun"><div class="cmc-halftone-light"></div></div>
  <svg id="ID-scene" viewBox="0 0 1080 1600">
    <path d="M-20 980 C200 820 380 900 560 860 C760 820 900 900 1100 840 L1100 1600 L-20 1600 Z" fill="#5E9E4B" stroke="#1C1410" stroke-width="10"/>
    <path d="M-20 1060 C240 980 420 1040 600 1010 C800 980 960 1050 1100 1020 L1100 1600 L-20 1600 Z" fill="#4C8A3B" stroke="#1C1410" stroke-width="10"/>
    <path d="M470 960 L610 960 L880 1600 L200 1600 Z" fill="#D9C29A" stroke="#1C1410" stroke-width="10" stroke-linejoin="round"/>
    <rect x="250" y="560" width="90" height="420" fill="#B5482F" stroke="#1C1410" stroke-width="10"/>
    <rect x="740" y="560" width="90" height="420" fill="#B5482F" stroke="#1C1410" stroke-width="10"/>
    <rect x="230" y="530" width="620" height="70" fill="#8E3522" stroke="#1C1410" stroke-width="10"/>
    <rect x="300" y="440" width="480" height="96" fill="#FFFFFF" stroke="#1C1410" stroke-width="10"/>
    <text x="540" y="510" text-anchor="middle" font-family="Shrikhand" font-size="64" fill="#8E3522">IIT Guwahati</text>
  </svg>
  <div id="ID-whatlineswrap"></div>
  <div id="ID-guywrap"></div>
  <div id="ID-id"><b class="cmc-label">New job</b><div id="ID-idph"></div><div id="ID-idtx" class="cmc-label"><span style="display:block">Asst.</span><span style="display:block">Professor</span></div></div>
  <div id="ID-what" class="cmc-bubble">WHAT?!</div>
  <div id="ID-twistwrap"></div>
  <div id="ID-twistword" class="cmc-shrik cmc-ink-outline cmc-stack-shadow" data-layout-allow-overlap>TWIST!</div>
</div>
</markup>
<script>
document.getElementById("ID-twistwrap").outerHTML = star("ID-twist", YELLOW, 16, 330, 480).replace('viewBox="0 0 1000 1000"', 'viewBox="0 0 1000 1000" preserveAspectRatio="none"');
document.getElementById("ID-whatlineswrap").outerHTML = burst("ID-whatlines", "#1C1410", 24, 0.62, 0.9);
const phone = `<g id="ID-phone"><rect x="250" y="560" width="70" height="120" rx="12" fill="#1C1410" stroke="#1C1410" stroke-width="6"/><rect x="258" y="572" width="54" height="92" rx="6" fill="#7FC8F8"/>
  <g id="ID-buzz" stroke="#D8000F" stroke-width="7" stroke-linecap="round" opacity="0"><path d="M232 580 L214 570 M232 620 L210 620 M338 580 L356 570 M338 620 L360 620"/></g></g>`;
document.getElementById("ID-guywrap").innerHTML = `<div id="ID-guy">${person("ID-u", "udaya", { propR: phone })}</div>`;
tl.set("#ID-phone", { opacity: 0 }, 0);
tl.fromTo("#ID-world", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);
tl.fromTo("#ID-sun", { rotation: 0 }, { rotation: 30, duration: DUR, ease: "none" }, 0);
// "here's the twist"
popIn(tl, "#ID-twist", 0.75, { rotation: -20 }, 0.35);
popIn(tl, "#ID-twistword", 0.85, { rotation: 15 }, 0.35);
shake(tl, "#ID-world", 1.1, 14);
tl.to(["#ID-twist", "#ID-twistword"], { scale: 0.35, x: -330, y: -330, duration: 0.4, ease: "power3.inOut" }, 1.6);
// he walks out through the gate toward us
tl.fromTo("#ID-guy", { scale: 0.42, y: -70 }, { scale: 1, y: 230, duration: 2.9, ease: "power1.inOut" }, 1.5);
for (let k = 0; k < 8; k++) {
  const t = 1.5 + k * 0.36, s = k % 2 ? 1 : -1;
  tl.to("#ID-u-legL", { rotation: 9 * s, svgOrigin: PIV.legL, duration: 0.18, ease: "sine.inOut" }, t);
  tl.to("#ID-u-legR", { rotation: -9 * s, svgOrigin: PIV.legR, duration: 0.18, ease: "sine.inOut" }, t);
  tl.to("#ID-u-armL", { rotation: -12 * s, svgOrigin: PIV.armL, duration: 0.18, ease: "sine.inOut" }, t);
  tl.to("#ID-u-armR", { rotation: -12 * s, svgOrigin: PIV.armR, duration: 0.18, ease: "sine.inOut" }, t);
  tl.to("#ID-u-torso", { y: k % 2 ? -6 : 0, duration: 0.18, ease: "sine.inOut" }, t);
}
pose(tl, "ID-u", 4.4, { legL: 0, legR: 0, armL: 0, armR: 0 }, 0.2, "power2.out");
blink(tl, "ID-u", [2.4, 4.7]);
mouth(tl, "ID-u", 3.3, "mOpen");
// "brand new job ... as a professor"
tl.fromTo("#ID-id", { x: 500, rotation: 20 }, { x: 0, rotation: 6, duration: 0.45, ease: "back.out(1.6)" }, 4.55);
tl.fromTo("#ID-idtx", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 5.05);
// the phone buzzes ... and it's the news
pose(tl, "ID-u", 5.45, { armR: -40, foreR: -70 }, 0.3);
tl.to("#ID-id", { x: 140, y: 330, scale: 0.75, rotation: 12, duration: 0.35, ease: "power3.inOut" }, 5.35);
tl.set("#ID-phone", { opacity: 1 }, 5.5);
tl.set("#ID-buzz", { opacity: 1 }, 5.7);
tl.fromTo("#ID-phone", { x: 0 }, { x: 5, duration: 0.04, yoyo: true, repeat: 7, ease: "none", immediateRender: false }, 5.7);
tl.set("#ID-buzz", { opacity: 0 }, 6.05);
mouth(tl, "ID-u", 6.1, "mShock");
tl.to("#ID-u-eyes", { scale: 1.35, svgOrigin: PIV.eyes, duration: 0.15, ease: "back.out(3)" }, 6.1);
tl.to("#ID-u-brows", { y: -22, duration: 0.15, ease: "back.out(3)" }, 6.1);
tl.fromTo("#ID-whatlines", { scale: 0, rotation: 0 }, { scale: 1, rotation: 20, duration: 0.5, ease: "power2.out" }, 6.15);
popIn(tl, "#ID-what", 6.2, { rotation: 18 }, 0.3);
shake(tl, "#ID-world", 6.4, 12);
</script>
