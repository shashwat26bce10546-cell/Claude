<style>
#ID-bg { background: #D8000F; }
#ID-burst { position: absolute; left: -700px; top: -300px; width: 1700px; height: 1700px; }
#ID-man { position: absolute; left: -10px; top: 560px; width: 450px; height: 1012px; }
#ID-shout { position: absolute; left: 330px; top: 300px; width: 640px; height: 420px; }
#ID-shoutword { position: absolute; left: 330px; top: 450px; width: 640px; text-align: center; font-size: 84px; color: #D8000F; transform-origin: 50% 50%; }
#ID-nation { position: absolute; left: 470px; top: 600px; padding: 10px 26px; background: #1C1410; color: #FFFFFF; font-size: 38px; }
#ID-count { position: absolute; left: 360px; top: 90px; width: 700px; text-align: center; font-size: 180px; color: #FFFFFF; }
#ID-entries { position: absolute; left: 560px; top: 300px; width: 340px; text-align: center; font-size: 44px; color: #FFD23F; }
#ID-bag { position: absolute; left: 560px; top: 1150px; width: 480px; height: 450px; overflow: visible; }
.ID-env { position: absolute; left: 0; top: 0; width: 130px; height: 86px; background: #FFFFFF; border: 6px solid #1C1410; }
.ID-env::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52px; background: linear-gradient(to bottom right, transparent 48%, #1C1410 48%, #1C1410 52%, transparent 52%) left / 50% 100% no-repeat, linear-gradient(to bottom left, transparent 48%, #1C1410 48%, #1C1410 52%, transparent 52%) right / 50% 100% no-repeat; }
</style>
<markup>
<div id="ID-bg" class="cmc-bg clip" data-start="0" data-duration="{DUR}" data-track-index="0"><div class="cmc-halftone-light"></div></div>
<div id="ID-world" class="cmc-world">
  <div id="ID-burstwrap"></div>
  <div id="ID-envs"></div>
  <svg id="ID-bag" viewBox="0 0 480 450">
    <path d="M90 120 C40 200 20 330 70 410 C130 460 350 460 410 410 C460 330 440 200 390 120 Z" fill="#C9A66B" stroke="#1C1410" stroke-width="10" stroke-linejoin="round"/>
    <path d="M360 140 C420 230 430 330 400 400 C380 420 350 430 320 434 C370 360 380 260 340 150 Z" fill="#A5854F"/>
    <path d="M70 120 C120 90 360 90 410 120 C360 150 120 150 70 120 Z" fill="#7A5A30" stroke="#1C1410" stroke-width="10"/>
    <text x="240" y="320" text-anchor="middle" font-family="Shrikhand" font-size="64" fill="#1C1410">DESIGNS</text>
  </svg>
  <div id="ID-manwrap"></div>
  <div id="ID-shoutwrap"></div>
  <div id="ID-shoutword" class="cmc-shrik">CONTEST!</div>
  <div id="ID-nation" class="cmc-label">Nationwide</div>
  <div id="ID-count" class="cmc-shrik cmc-ink-outline cmc-stack-shadow">0</div>
  <div id="ID-entries" class="cmc-label">entries</div>
</div>
</markup>
<script>
document.getElementById("ID-burstwrap").outerHTML = burst("ID-burst", "#A8000B", 36, 0.12);
// shout balloon: jagged white star
document.getElementById("ID-shoutwrap").outerHTML = star("ID-shout", "#FFFFFF", 16, 330, 470).replace('viewBox="0 0 1000 1000"', 'viewBox="0 0 1000 1000" preserveAspectRatio="none"');
// megaphone held at the mouth (character space)
const mega = `<g id="ID-mega"><path d="M226 258 L246 248 L470 170 L500 330 L246 292 L226 284 Z" fill="#FFD23F" stroke="#1C1410" stroke-width="9" stroke-linejoin="round"/>
  <ellipse cx="486" cy="250" rx="26" ry="82" fill="#D8000F" stroke="#1C1410" stroke-width="9"/>
  <g id="ID-waves" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"><path d="M540 190 Q570 250 540 310"/><path d="M580 160 Q624 250 580 340"/><path d="M620 130 Q680 250 620 370"/></g></g>`;
document.getElementById("ID-manwrap").innerHTML = `<div id="ID-man">${person("ID-o", "official", { overlay: mega })}</div>`;
setPose(tl, "ID-o", { armR: -60, foreR: -80, armL: 12, foreL: 30 });
// envelopes: deterministic rain into the sack
const envs = document.getElementById("ID-envs");
const N = 16;
for (let i = 0; i < N; i++) {
  const e = document.createElement("div");
  e.className = "ID-env";
  e.id = "ID-env" + i;
  envs.appendChild(e);
  const x0 = 560 + ((i * 137) % 420), r0 = ((i * 53) % 60) - 30;
  const t0 = 2.85 + i * 0.12;
  tl.fromTo(e, { x: x0, y: -200, rotation: r0, opacity: 1 },
    { x: 740 + ((i * 29) % 80), y: 1180, rotation: r0 + 180, duration: 0.55, ease: "power2.in" }, t0);
  tl.to(e, { opacity: 0, duration: 0.05 }, t0 + 0.55);
}
tl.fromTo("#ID-world", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);
tl.fromTo("#ID-burst", { rotation: 0 }, { rotation: -15, duration: DUR, ease: "none" }, 0);
// official strides in
tl.fromTo("#ID-man", { x: -500 }, { x: 0, duration: 0.45, ease: "back.out(1.4)" }, 0);
blink(tl, "ID-o", [0.6, 3.4]);
// "launched" — he shouts through the megaphone
const talk = [1.0, 1.15, 1.3, 1.45, 1.6, 1.75, 1.9, 2.05, 2.2];
talk.forEach((t, i) => mouth(tl, "ID-o", t, i % 2 ? "mSmile" : "mOpen"));
mouth(tl, "ID-o", 2.35, "mSmile");
tl.fromTo("#ID-waves", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 1.0);
tl.fromTo("#ID-waves", { x: 0 }, { x: 18, duration: 0.18, yoyo: true, repeat: 7, ease: "sine.inOut", immediateRender: false }, 1.0);
tl.to("#ID-waves", { opacity: 0, duration: 0.2 }, 2.5);
pose(tl, "ID-o", 0.95, { head: -6, armL: 25 }, 0.25);
popIn(tl, "#ID-shout", 1.03, { rotation: -10 });
popIn(tl, "#ID-shoutword", 1.1, { rotation: 10 });
tl.fromTo("#ID-nation", { scaleX: 0, rotation: -3 }, { scaleX: 1, rotation: -3, duration: 0.3, ease: "back.out(2)" }, 1.63);
// shout shrinks away as the envelopes start
tl.to(["#ID-shout", "#ID-shoutword", "#ID-nation"], { scale: 0.55, x: 120, y: -40, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.75);
tl.fromTo("#ID-bag", { y: 500 }, { y: 0, duration: 0.4, ease: "back.out(1.6)" }, 2.6);
// "three thousand" counter slams
const counter = { v: 0 };
const el = document.getElementById("ID-count");
tl.set(el, { textContent: "0" }, 0);
tl.fromTo("#ID-count", { scale: 0, rotation: 15 }, { scale: 1, rotation: -6, duration: 0.35, ease: "back.out(2)" }, 2.95);
tl.fromTo(counter, { v: 0 }, { v: 3000, duration: 0.75, ease: "power2.out", immediateRender: false,
  onUpdate: () => { el.textContent = Math.round(counter.v).toLocaleString("en-IN") + (counter.v > 2999 ? "+" : ""); } }, 3.0);
shake(tl, "#ID-world", 3.75, 14);
popIn(tl, "#ID-entries", 3.8, { rotation: 6 });
tl.fromTo("#ID-bag", { scaleY: 1 }, { scaleY: 1.06, svgOrigin: "240 450", duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, 3.5);
pose(tl, "ID-o", 4.0, { head: 4 }, 0.3);
mouth(tl, "ID-o", 4.0, "mOpen");
</script>
