<!doctype html>
<!-- Scene D (5s): grid of 60 entry cards pops in from the centre (stagger by distance),
     then filters 60 → 5 (red outline) → 1 (flies to centre with a glow). The 3000+ count
     is the count-up component mounted over this scene in index.html. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-ExtraBold.otf") format("opentype");
          font-weight: 800;
        }
        @font-face {
          font-family: "Noto Sans Devanagari";
          src: url("assets/fonts/NotoSansDevanagari-Bold.ttf") format("truetype");
          font-weight: 700;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: radial-gradient(circle at 50% 55%, #1a2238 0%, #070a12 70%);
          font-family: "Inter", "Noto Sans Devanagari", sans-serif;
        }
        .mg-cell {
          position: absolute;
          width: 136px;
          height: 136px;
          border-radius: 18px;
          background: #f4f1e8;
          color: #1d2230;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
          font-size: 64px;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
          outline: 0 solid #e53935;
        }
        .mg-cell.hl {
          outline: 8px solid #e53935;
        }
        .mg-label {
          position: absolute;
          left: 0;
          right: 0;
          top: 110px;
          text-align: center;
          font-weight: 800;
          font-size: 92px;
          letter-spacing: -0.02em;
          color: #fff;
          text-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        .mg-label em {
          font-style: normal;
          color: #e53935;
        }
        .mg-glow {
          position: absolute;
          left: 540px;
          top: 840px;
          width: 700px;
          height: 700px;
          margin: -350px 0 0 -350px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 154, 31, 0.55) 0%, rgba(255, 154, 31, 0) 65%);
        }
      </style>

      <div id="root" data-composition-id="mg-grid" data-width="1080" data-height="1920">
        <div class="mg-glow" id="mg-glow"></div>
        <div id="mg-cells"></div>
        <div class="mg-label" id="mg-l5"><em>TOP 5</em> shortlist</div>
        <div class="mg-label" id="mg-l1">sirf <em>EK</em> winner</div>
      </div>

      <script>
        (function () {
          // 6 x 8 grid of entries; glyph variety is index-derived (deterministic)
          const COLS = 6, ROWS = 7, W = 136, GAP = 22;
          const x0 = 540 - (COLS * W + (COLS - 1) * GAP) / 2;
          const y0 = 840 - (ROWS * W + (ROWS - 1) * GAP) / 2;
          const glyphs = ["Rs", "R", "र", "Rp", "R=", "₨", "रु", "Ɍ", "R̶", "रू"];
          const top5 = [8, 15, 20, 27, 34];
          const winner = 20;
          const holder = document.getElementById("mg-cells");
          const cells = [];
          for (let i = 0; i < COLS * ROWS; i++) {
            const c = document.createElement("div");
            c.className = "mg-cell";
            c.id = "mg-cell-" + i;
            const col = i % COLS, row = Math.floor(i / COLS);
            c.style.left = x0 + col * (W + GAP) + "px";
            c.style.top = y0 + row * (W + GAP) + "px";
            const g = document.createElement("span");
            g.textContent = i === winner ? "₹" : glyphs[(i * 7 + row) % glyphs.length];
            c.appendChild(g);
            if (i === winner) c.style.fontFamily = '"Noto Sans Devanagari", sans-serif';
            holder.appendChild(c);
            const dx = col - (COLS - 1) / 2, dy = row - (ROWS - 1) / 2;
            cells.push({ el: c, d: Math.sqrt(dx * dx + dy * dy), col, row });
          }
          const tl = gsap.timeline({ paused: true });
          const maxD = Math.max(...cells.map((c) => c.d));
          cells.forEach((c, i) => {
            tl.fromTo(c.el, { scale: 0, rotation: (i % 2 ? 1 : -1) * 20 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2)" }, 0.05 + (c.d / maxD) * 0.55);
          });
          // 60 -> 5
          cells.forEach((c, i) => {
            if (top5.includes(i)) {
              tl.to(c.el, { scale: 1.18, duration: 0.25, ease: "back.out(2)" }, 2.0);
              tl.set(c.el, { className: "mg-cell hl" }, 2.0);
            } else {
              tl.to(c.el, { opacity: 0.18, scale: 0.85, duration: 0.3, ease: "power2.out" }, 2.0 + (i % 7) * 0.015);
              tl.to(c.el.firstChild, { opacity: 0, duration: 0.2 }, 2.0 + (i % 7) * 0.015);
            }
          });
          tl.fromTo("#mg-l5", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 2.1);
          tl.to("#mg-l5", { opacity: 0, duration: 0.2 }, 3.25);
          // 5 -> 1: losers drop, winner flies to the centre and grows
          top5.forEach((i) => {
            if (i !== winner) {
              tl.to(cells[i].el, { opacity: 0.12, scale: 0.8, duration: 0.25 }, 3.3);
              tl.to(cells[i].el.firstChild, { opacity: 0, duration: 0.15 }, 3.3);
            }
          });
          const w = cells[winner];
          const wx = 540 - (x0 + w.col * (W + GAP) + W / 2);
          const wy = 840 - (y0 + w.row * (W + GAP) + W / 2);
          tl.set(w.el, { zIndex: 0 }, 0);
          tl.set(w.el, { zIndex: 50 }, 3.35);
          tl.to(w.el, { x: wx, y: wy, scale: 3.1, duration: 0.6, ease: "power3.inOut" }, 3.4);
          tl.fromTo("#mg-glow", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 3.6);
          tl.fromTo("#mg-l1", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 3.8);
          window.__timelines["mg-grid"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
